name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Publicar também em produção'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore backend/Stoctable.slnx

      - name: Build
        run: dotnet build backend/Stoctable.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test backend/Stoctable.Tests/Stoctable.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish backend/Stoctable.Api/Stoctable.Api.csproj --configuration Release --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

  # Dev publica automaticamente a cada push em main.
  deploy-dev:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: development

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

      - name: Deploy to Azure App Service (dev)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'stoctable-api-dev'
          slot-name: 'Production'
          package: ./publish
          publish-profile: ${{ secrets.AZURE_APP_SERVICE_PUBLISH_PROFILE_DEV }}

  # Produção só sai por acionamento manual e explícito, e só a partir de main —
  # sem a checagem de ref, um workflow_dispatch em qualquer branch publicaria
  # aquele código em produção.
  deploy-prod:
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_production &&
      github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

      - name: Deploy to Azure App Service (prod)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'stoctable-api'
          slot-name: 'Production'
          package: ./publish
          publish-profile: ${{ secrets.AZURE_APP_SERVICE_PUBLISH_PROFILE }}
