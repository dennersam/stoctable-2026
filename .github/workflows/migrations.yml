name: Database Migrations

on:
  workflow_run:
    workflows: ['Backend CI/CD']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Ambiente alvo'
        type: choice
        options: [dev, prod]
        default: dev
      branch_ids:
        description: 'IDs de filial separados por vírgula (vazio = todas)'
        required: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    # O encadeamento automático só vale para o Backend CI/CD disparado por push
    # (ou seja, o deploy de dev). Sem o filtro de event, um deploy manual de
    # produção também dispararia esta migration logo em seguida.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    # O environment define de onde vem o secret, então BRANCH_CONNECTION_STRINGS_JSON
    # tem o mesmo nome nos dois e valores diferentes. Isso elimina a chance de
    # cair no banco errado e faz a migration de produção herdar as regras de
    # proteção do environment (ex: aprovação obrigatória).
    environment: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.target_environment == 'prod')
          && 'production' || 'development' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef

      # O startup-project é o Api, então ele também precisa estar buildado —
      # antes só o Infrastructure era compilado e o --no-build falhava.
      - name: Build
        run: dotnet build backend/Stoctable.Api/Stoctable.Api.csproj --configuration Release

      # O control plane é o banco de empresas, filiais e contas de login. Migra
      # primeiro: se ele falhar, migrar os tenants não adianta nada — a API não
      # sobe sem ele.
      - name: Run control plane migrations
        working-directory: backend
        env:
          CONTROL_PLANE_CONN_STRING: ${{ secrets.CONTROL_PLANE_CONNECTION_STRING }}
        run: |
          set -euo pipefail

          if [ -z "${CONTROL_PLANE_CONN_STRING:-}" ]; then
            echo "::error::Secret CONTROL_PLANE_CONNECTION_STRING vazio para este ambiente."
            exit 1
          fi

          dotnet ef database update \
            --context ControlPlaneDbContext \
            --project Stoctable.Infrastructure/Stoctable.Infrastructure.csproj \
            --startup-project Stoctable.Api/Stoctable.Api.csproj \
            --configuration Release \
            --no-build

      # NOTA: este passo ainda itera por FILIAL, do modelo antigo em que cada
      # filial tinha um banco. Hoje o banco é por EMPRESA, e o secret precisa
      # mapear empresa => connection string. Enquanto houver um cliente só o
      # efeito é o mesmo, mas isto tem de ser reescrito para ler as empresas do
      # control plane antes de existir a segunda.
      - name: Run migrations for each tenant database
        working-directory: backend
        env:
          # Resolvido pelo environment do job: development em disparo automático,
          # production apenas quando escolhido manualmente.
          BRANCH_CONN_STRINGS: ${{ secrets.BRANCH_CONNECTION_STRINGS_JSON }}
          SPECIFIC_BRANCH_IDS: ${{ inputs.branch_ids }}
        run: |
          set -euo pipefail

          if [ -z "${BRANCH_CONN_STRINGS:-}" ]; then
            echo "::error::Secret de connection strings vazio para este ambiente."
            exit 1
          fi

          # Formato: {"001": "Host=...;Database=...", "002": "..."}
          if [ -n "$SPECIFIC_BRANCH_IDS" ]; then
            CONN_STRINGS=$(echo "$BRANCH_CONN_STRINGS" | jq --arg ids "$SPECIFIC_BRANCH_IDS" \
              'to_entries
               | map(select(.key as $k
                   | ($ids | split(",") | map(gsub("^\\s+|\\s+$";"")) | index($k)) != null))
               | from_entries')
          else
            CONN_STRINGS="$BRANCH_CONN_STRINGS"
          fi

          COUNT=$(echo "$CONN_STRINGS" | jq 'length')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Nenhuma filial corresponde ao filtro informado."
            exit 1
          fi
          echo "Migrando $COUNT filial(is)."

          # Sem pipe para o while: um subshell engoliria o exit code de falha.
          while IFS=$'\t' read -r branch_id conn_str; do
            echo "::group::Filial $branch_id"
            # --context obrigatório: o projeto tem dois DbContext desde que o
            # control plane existe, e sem ele o CLI aborta com ambiguidade.
            DEFAULT_CONN_STRING="$conn_str" dotnet ef database update \
              --context StoctableDbContext \
              --project Stoctable.Infrastructure/Stoctable.Infrastructure.csproj \
              --startup-project Stoctable.Api/Stoctable.Api.csproj \
              --configuration Release \
              --no-build
            echo "✓ Filial $branch_id migrada"
            echo "::endgroup::"
          done < <(echo "$CONN_STRINGS" | jq -r 'to_entries[] | "\(.key)\t\(.value)"')
